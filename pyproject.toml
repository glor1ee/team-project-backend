# Dependencies live in requirements.txt / requirements-dev.txt.
# This file only holds tool configuration.

[tool.ruff]
line-length = 88
target-version = "py312"
extend-exclude = ["migrations"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "C4", "SIM", "RUF"]
# Django/DRF class attributes (Meta, admin options) are mutable by design.
ignore = ["RUF012"]

[tool.ruff.lint.per-file-ignores]
# Settings modules re-export names through star imports on purpose.
"config/settings/*" = ["F403", "F405"]

[tool.ruff.format]
quote-style = "double"

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings.development"
pythonpath = ["."]
testpaths = ["tests", "apps"]
python_files = ["test_*.py"]
addopts = "-q"

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
exclude = ["migrations"]
